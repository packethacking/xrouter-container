# XROUTER.CFG -- target config for axudp-fuzz.py.
#
# - HTTP on port 80 is the liveness probe the fuzzer hits.
# - AXUDP listens on UDP/93 in "Many-Links-Per-Port" mode with LEARN=1,
#   so unsolicited packets from any source IP are accepted into the
#   AX.25 parser.
# - Everything else is loopback so the fuzzing run doesn't need RF or
#   any extra Linux capabilities.

DNS=8.8.8.8
NODECALL=G9DUM-1
NODEALIAS=DUMMY
CONSOLECALL=G9DUM
CHATCALL=G9DUM-8
CHATALIAS=DUMCHT
LOCATOR=IO92

# AXUDP wants an IPADDRESS to be set; the value doesn't have to be reachable.
IPADDRESS=44.128.128.128

CTEXT
fuzz target
***
INFOTEXT
fuzz target
***
IDTEXT
fuzz target
***

HTTPPORT=80 80
TELNETPORT=0
FTPPORT=0
RLOGINPORT=0
MQTTPORT=0
AGWPORT=0
TELPROXYPORT=0

INTERFACE=1
	TYPE=LOOPBACK
	PROTOCOL=KISS
	MTU=256
ENDINTERFACE

PORT=1
	ID="Loopback port"
	INTERFACENUM=1
ENDPORT

INTERFACE=2
	TYPE=AXUDP
	MTU=256
ENDINTERFACE

PORT=2
	ID="AXUDP fuzz target"
	INTERFACENUM=2
	IPLINK=0.0.0.0
	UDPLOCAL=10093
	LEARN=1
ENDPORT
