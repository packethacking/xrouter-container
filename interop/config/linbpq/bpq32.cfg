; LinBPQ config for the XRouter <-> LinBPQ NET/ROM + INP3 interop suite.
;
; Addresses are fixed on the private compose network 172.28.77.0/24:
;   .10 relay   .11 xrouter   .12 linbpq   .13 linbpq2
; Every AXUDP peer is the relay, which forwards datagrams unchanged.
;
; INP3: BPQ only runs INP3 on a neighbour route flagged for it. The ROUTES
; block below locks both neighbours in with the INP3 flag (7th field = 1),
; which is the usual way a BPQ sysop enables INP3 towards XRouter.

SIMPLE=1
NODECALL=PN0BQ
NODEALIAS=BPQNOD
LOCATOR=IO91WL

; Short timers for a fast test run.
NODESINTERVAL=1
RIFINTERVAL=60
T3=15
; Write INP3 decisions to the log so failures can be explained.
DEBUGINP3=1

CTEXT:
PN0BQ LinBPQ interop test node
***

; A BPQ application with its own NET/ROM call and alias. BPQ advertises it in
; NODES and in its own RIF, so XRouter should learn BQAPP via both.
APPLICATION 1,BQAPP,,PN0BQ-1,BQAPP,200

PORT
 PORTNUM=1
 ID=Telnet
 DRIVER=Telnet
 CONFIG
 TCPPORT=8010
 HTTPPORT=8008
 MAXSESSIONS=10
 USER=sysop,sysop,PN0BQ,,SYSOP
ENDPORT

; AXUDP to XRouter, through the relay. The relay faces BPQ on 172.28.77.10:20002.
PORT
 PORTNUM=2
 ID=AXUDP to XRouter via relay
 DRIVER=BPQAXIP
 QUALITY=200
 MINQUAL=1
 FRACK=2000
 RESPTIME=200
 RETRIES=3
 MAXFRAME=4
 PACLEN=236
 CONFIG
 UDP 10093
 BROADCAST NODES
 MAP PN0XR 172.28.77.10 UDP 20002 B
ENDPORT

; AXUDP to the second LinBPQ (PN0BQB), through the relay on 172.28.77.10:20004.
; PN0BQB is a node only this BPQ can hear directly, so it is the third-party
; destination XRouter should learn about only via BPQ.
PORT
 PORTNUM=3
 ID=AXUDP to LinBPQ2 via relay
 DRIVER=BPQAXIP
 QUALITY=200
 MINQUAL=1
 FRACK=2000
 RESPTIME=200
 RETRIES=3
 MAXFRAME=4
 PACLEN=236
 CONFIG
 UDP 10094
 BROADCAST NODES
 MAP PN0BQB 172.28.77.10 UDP 20004 B
ENDPORT

; Locked neighbour routes with the INP3 flag:
; call, quality, port, maxframe, frack, paclen, inp3
ROUTES:
PN0XR,200,2,0,0,0,1
PN0BQB,200,3,0,0,0,1
***
