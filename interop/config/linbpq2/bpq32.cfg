; Second LinBPQ (PN0BQB) for the interop suite. It links only to the first
; LinBPQ (PN0BQ), through the relay, so XRouter can only learn about it
; second-hand: that makes it the third-party destination for the INP3 tests.
;
; Addresses: .10 relay   .11 xrouter   .12 linbpq   .13 linbpq2

SIMPLE=1
NODECALL=PN0BQB
NODEALIAS=BPQB
LOCATOR=IO91WL

NODESINTERVAL=1
RIFINTERVAL=60
T3=15
DEBUGINP3=1

CTEXT:
PN0BQB LinBPQ interop test node 2
***

PORT
 PORTNUM=1
 ID=Telnet
 DRIVER=Telnet
 CONFIG
 TCPPORT=8010
 HTTPPORT=8008
 MAXSESSIONS=10
 USER=sysop,sysop,PN0BQB,,SYSOP
ENDPORT

; AXUDP to PN0BQ, through the relay on 172.28.77.10:20003.
PORT
 PORTNUM=2
 ID=AXUDP to LinBPQ via relay
 DRIVER=BPQAXIP
 QUALITY=200
 MINQUAL=1
 FRACK=2000
 RESPTIME=200
 RETRIES=3
 MAXFRAME=4
 PACLEN=236
 CONFIG
 UDP 10093
 BROADCAST NODES
 MAP PN0BQ 172.28.77.10 UDP 20003 B
ENDPORT

ROUTES:
PN0BQ,200,2,0,0,0,1
***
