; Third LinBPQ (PN0BQC) for the interop suite. It links only to XRouter (PN0XR),
; through the relay, so XRouter is its only way to the rest of the network.
; That makes XRouter a transit node: it must relay INP3 both ways.
;
; Addresses: .10 relay   .11 xrouter   .12 linbpq   .13 linbpq2   .14 linbpq3

SIMPLE=1
NODECALL=PN0BQC
NODEALIAS=BPQC
LOCATOR=IO91WL

NODESINTERVAL=1
RIFINTERVAL=60
T3=15
DEBUGINP3=1

CTEXT:
PN0BQC LinBPQ interop test node 3
***

PORT
 PORTNUM=1
 ID=Telnet
 DRIVER=Telnet
 CONFIG
 TCPPORT=8010
 HTTPPORT=8008
 MAXSESSIONS=10
 USER=sysop,sysop,PN0BQC,,SYSOP
ENDPORT

; AXUDP to XRouter PN0XR, through the relay on 172.28.77.10:20006.
PORT
 PORTNUM=2
 ID=AXUDP to XRouter via relay
 DRIVER=BPQAXIP
 QUALITY=200
 MINQUAL=1
 FRACK=2000
 RESPTIME=200
 RETRIES=3
 MAXFRAME=4
 PACLEN=236
 CONFIG
 UDP 10093
 BROADCAST NODES
 MAP PN0XR 172.28.77.10 UDP 20006 B
ENDPORT

ROUTES:
PN0XR,200,2,0,0,0,1
***
