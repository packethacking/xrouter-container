# XRouter config for the XRouter <-> LinBPQ NET/ROM + INP3 interop suite.
#
# Comment lines must start in column 1 (XRouter is strict about this).
# All addresses are fixed on the private compose network 172.28.77.0/24:
#   .10 relay   .11 xrouter   .12 linbpq   .13 linbpq2   .14 linbpq3
#   .15 xnet    .16 tnn       .17 thenet   .18 xrpeer (a second XRouter)
#
# Ports 3 to 6 lead to the other implementations. Each is only started when
# its compose profile is enabled; with a peer absent its port just never
# comes up, which does not disturb the LinBPQ tests.
#
# INP3 needs no switch in XRouter: it probes L3RTT on every open neighbour
# link and unicasts RIFs to neighbours that answer (see MAN INP3, L3RTT).
# The intervals below are shortened so a test run finishes in minutes.

NODECALL=PN0XR
NODEALIAS=XRNODE
CONSOLECALL=PN0XR

# Telnet console for the tests (mapped to 127.0.0.1:17023 on the host).
TELNETPORT=23
# RHP (remote host protocol) API for the RHP checks in test_06_rhp.py.
RHPPORT=9000
LOCATOR=IO91WL

# IPADDRESS must be set or AXUDP is blocked entirely (MAN AXUDP-IFACE).
IPADDRESS=172.28.77.11

# Short NET/ROM and INP3 timers for a fast test run.
NODESINTERVAL=1
L3RTTINTERVAL=30
INPBCINTERVAL=120
T3=15
IDLETIME=900

CTEXT
PN0XR XRouter interop test node
***

# An application with its own NET/ROM call and alias, so XRouter has
# something besides itself to advertise in NODES and in its RIFs.
APPL=1
    APPLNAME=XRAPP
    APPLCALL=PN0XR-1
    APPLALIAS=XRAPP
    APPLQUAL=200
ENDAPPL

INTERFACE=1
    TYPE=AXUDP
    MTU=256
ENDINTERFACE

# TheNet X1J (tnc2-emu) is a TCP KISS server. XRouter dials the relay's
# KISS tap on 20101, which dials the emulator and logs every frame.
INTERFACE=2
    TYPE=TCP
    ID=TheNet KISS tap
    PROTOCOL=KISS
    MTU=256
    IOADDR=172.28.77.10
    INTNUM=20101
ENDINTERFACE

# One-link-per-port AXUDP to LinBPQ, through the relay. XRouter talks only
# to the relay (172.28.77.10:20001); the relay forwards to LinBPQ unchanged.
PORT=1
    ID=AXUDP to LinBPQ via relay
    INTERFACENUM=1
    IPLINK=172.28.77.10
    UDPLOCAL=10093
    UDPREMOTE=20001
    QUALITY=200
    FRACK=2000
    RESPTIME=200
    RETRIES=3
    MAXFRAME=4
    PACLEN=236
ENDPORT

# Second AXUDP link, to LinBPQ3 (PN0BQC), through the relay on 20005.
# LinBPQ3 has no other neighbour, so XRouter is its transit node.
PORT=2
    ID=AXUDP to LinBPQ3 via relay
    INTERFACENUM=1
    IPLINK=172.28.77.10
    UDPLOCAL=10094
    UDPREMOTE=20005
    QUALITY=200
    FRACK=2000
    RESPTIME=200
    RETRIES=3
    MAXFRAME=4
    PACLEN=236
ENDPORT

# Third AXUDP link, to XNet 1.38 (PN0XN), through the relay on 20007.
PORT=3
    ID=AXUDP to XNet via relay
    INTERFACENUM=1
    IPLINK=172.28.77.10
    UDPLOCAL=10095
    UDPREMOTE=20007
    QUALITY=200
    FRACK=2000
    RESPTIME=200
    RETRIES=3
    MAXFRAME=4
    PACLEN=236
ENDPORT

# Fourth AXUDP link, to TheNetNode 1.79 (PN0TN), through the relay on 20009.
PORT=4
    ID=AXUDP to TNN via relay
    INTERFACENUM=1
    IPLINK=172.28.77.10
    UDPLOCAL=10096
    UDPREMOTE=20009
    QUALITY=200
    FRACK=2000
    RESPTIME=200
    RETRIES=3
    MAXFRAME=4
    PACLEN=236
ENDPORT

# TheNet X1J's radio port, KISS over TCP through the relay's tap. A
# simulated 1200 bit/s channel, so slow timers as for real radio.
PORT=5
    ID=TheNet X1J via relay
    INTERFACENUM=2
    CHANNEL=A
    QUALITY=192
    MAXFRAME=2
    PACLEN=120
    FRACK=8000
    RESPTIME=1500
    RETRIES=10
ENDPORT

# Fifth AXUDP link, to a second XRouter of another version (PN0XP),
# through the relay on 20011.
PORT=6
    ID=AXUDP to XRpeer via relay
    INTERFACENUM=1
    IPLINK=172.28.77.10
    UDPLOCAL=10097
    UDPREMOTE=20011
    QUALITY=200
    FRACK=2000
    RESPTIME=200
    RETRIES=3
    MAXFRAME=4
    PACLEN=236
ENDPORT
