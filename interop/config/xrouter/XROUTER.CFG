# XRouter config for the XRouter <-> LinBPQ NET/ROM + INP3 interop suite.
#
# Comment lines must start in column 1 (XRouter is strict about this).
# All addresses are fixed on the private compose network 172.28.77.0/24:
#   .10 relay   .11 xrouter   .12 linbpq   .13 linbpq2   .14 linbpq3
#
# INP3 needs no switch in XRouter: it probes L3RTT on every open neighbour
# link and unicasts RIFs to neighbours that answer (see MAN INP3, L3RTT).
# The intervals below are shortened so a test run finishes in minutes.

NODECALL=PN0XR
NODEALIAS=XRNODE
CONSOLECALL=PN0XR

# Telnet console for the tests (mapped to 127.0.0.1:17023 on the host).
TELNETPORT=23
LOCATOR=IO91WL

# IPADDRESS must be set or AXUDP is blocked entirely (MAN AXUDP-IFACE).
IPADDRESS=172.28.77.11

# Short NET/ROM and INP3 timers for a fast test run.
NODESINTERVAL=1
L3RTTINTERVAL=30
INPBCINTERVAL=120
T3=15
IDLETIME=900

CTEXT
PN0XR XRouter interop test node
***

# An application with its own NET/ROM call and alias, so XRouter has
# something besides itself to advertise in NODES and in its RIFs.
APPL=1
    APPLNAME=XRAPP
    APPLCALL=PN0XR-1
    APPLALIAS=XRAPP
    APPLQUAL=200
ENDAPPL

INTERFACE=1
    TYPE=AXUDP
    MTU=256
ENDINTERFACE

# One-link-per-port AXUDP to LinBPQ, through the relay. XRouter talks only
# to the relay (172.28.77.10:20001); the relay forwards to LinBPQ unchanged.
PORT=1
    ID=AXUDP to LinBPQ via relay
    INTERFACENUM=1
    IPLINK=172.28.77.10
    UDPLOCAL=10093
    UDPREMOTE=20001
    QUALITY=200
    FRACK=2000
    RESPTIME=200
    RETRIES=3
    MAXFRAME=4
    PACLEN=236
ENDPORT

# Second AXUDP link, to LinBPQ3 (PN0BQC), through the relay on 20005.
# LinBPQ3 has no other neighbour, so XRouter is its transit node.
PORT=2
    ID=AXUDP to LinBPQ3 via relay
    INTERFACENUM=1
    IPLINK=172.28.77.10
    UDPLOCAL=10094
    UDPREMOTE=20005
    QUALITY=200
    FRACK=2000
    RESPTIME=200
    RETRIES=3
    MAXFRAME=4
    PACLEN=236
ENDPORT
