# The second XRouter (PN0XP) in the interop suite, a different version from
# the one under test (XROUTER_PEER_TAG). It links only to the XRouter under
# test, so everything it knows of the rest of the network comes by NET/ROM
# and INP3 from that XRouter, and everything the rest knows of it likewise.
#
# Comment lines must start in column 1.

NODECALL=PN0XP
NODEALIAS=XRPEER
CONSOLECALL=PN0XP

TELNETPORT=23
LOCATOR=IO91WL
IPADDRESS=172.28.77.18

NODESINTERVAL=1
L3RTTINTERVAL=30
INPBCINTERVAL=120
T3=15
IDLETIME=900

CTEXT
PN0XP XRouter interop peer node
***

APPL=1
    APPLNAME=XPAPP
    APPLCALL=PN0XP-1
    APPLALIAS=XPAPP
    APPLQUAL=200
ENDAPPL

INTERFACE=1
    TYPE=AXUDP
    MTU=256
ENDINTERFACE

# AXUDP to the XRouter under test, through the relay on 20012.
PORT=1
    ID=AXUDP to XRouter via relay
    INTERFACENUM=1
    IPLINK=172.28.77.10
    UDPLOCAL=10093
    UDPREMOTE=20012
    QUALITY=200
    FRACK=2000
    RESPTIME=200
    RETRIES=3
    MAXFRAME=4
    PACLEN=236
ENDPORT
