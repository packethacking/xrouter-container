# XRouter <-> LinBPQ NET/ROM + INP3 interop stack.
#
# Every node's AXUDP peer is the relay, which forwards datagrams unchanged
# and logs each one decoded (see relay/axudp_relay.py). To add a node, add a
# service with a fixed address below, give it a config, and add a link for
# it in relay/links.json.
#
#   172.28.77.10  relay     AXUDP relay + wire log, control on :8080
#   172.28.77.11  xrouter   PN0XR  / XRNODE (and app PN0XR-1 / XRAPP)
#   172.28.77.12  linbpq    PN0BQ  / BPQNOD (and app PN0BQ-1 / BQAPP)
#   172.28.77.13  linbpq2   PN0BQB / BPQB   (only linked to linbpq)
#   172.28.77.14  linbpq3   PN0BQC / BPQC   (only linked to xrouter)
#   172.28.77.15  xnet      PN0XN  / XNET   (XNet 1.38, profile xnet)
#   172.28.77.16  tnn       PN0TN  / TNN    (TheNetNode 1.79, profile tnn)
#   172.28.77.17  thenet    PN0TH  / THENET (TheNet X1J on tnc2-emu, profile thenet)
#   172.28.77.18  xrpeer    PN0XP  / XRPEER (a second XRouter, profile xrpeer)
#
# The four peers of other implementations sit behind compose profiles so a
# run can leave some out (XRI_PEERS in the tests, COMPOSE_PROFILES here).
# XNet and TheNetNode are built locally from their upstream downloads and
# must never be pushed anywhere: neither licence allows us to publish them.
#
# XROUTER_TAG picks the XRouter image tag (default latest), LINBPQ_TAG the
# LinBPQ one, XROUTER_PEER_TAG the second XRouter's (the tests default it to
# the newest version before XROUTER_TAG).

name: xri

services:
  relay:
    image: python:3.12-slim
    container_name: xri-relay
    user: "${XRI_UID:-1000}:${XRI_GID:-1000}"
    command:
      - python3
      - -u
      - /relay/axudp_relay.py
      - --config=/relay/links.json
      - --log=/out/relay.jsonl
      - --text-log=/out/relay.txt
    volumes:
      - ./relay:/relay:ro
      - ${XRI_OUT:-./out}:/out
    ports:
      - "127.0.0.1:${XRI_RELAY_PORT:-17080}:8080"
    networks:
      xri:
        ipv4_address: 172.28.77.10

  xrouter:
    image: ghcr.io/packethacking/xrouter:${XROUTER_TAG:-latest}
    container_name: xri-xrouter
    depends_on: [relay]
    cap_add: [NET_RAW]
    volumes:
      - xrouter-data:/data
      - ./config/xrouter/XROUTER.CFG:/data/XROUTER.CFG:ro
      - ./config/xrouter/ACCESS.SYS:/data/ACCESS.SYS:ro
      - ./config/xrouter/CRONTAB.SYS:/data/CRONTAB.SYS:ro
    ports:
      - "127.0.0.1:${XRI_XR_TELNET:-17023}:23"
      - "127.0.0.1:${XRI_XR_RHP:-17090}:9000"
    networks:
      xri:
        ipv4_address: 172.28.77.11

  linbpq:
    image: m0lte/linbpq:${LINBPQ_TAG:-latest}
    container_name: xri-linbpq
    depends_on: [relay]
    volumes:
      - linbpq-data:/data
      - ./config/linbpq/bpq32.cfg:/data/bpq32.cfg:ro
    ports:
      - "127.0.0.1:${XRI_BPQ_TELNET:-17010}:8010"
    networks:
      xri:
        ipv4_address: 172.28.77.12

  linbpq2:
    image: m0lte/linbpq:${LINBPQ_TAG:-latest}
    container_name: xri-linbpq2
    depends_on: [relay]
    volumes:
      - linbpq2-data:/data
      - ./config/linbpq2/bpq32.cfg:/data/bpq32.cfg:ro
    ports:
      - "127.0.0.1:${XRI_BPQ2_TELNET:-17011}:8010"
    networks:
      xri:
        ipv4_address: 172.28.77.13

  linbpq3:
    image: m0lte/linbpq:${LINBPQ_TAG:-latest}
    container_name: xri-linbpq3
    depends_on: [relay]
    volumes:
      - linbpq3-data:/data
      - ./config/linbpq3/bpq32.cfg:/data/bpq32.cfg:ro
    ports:
      - "127.0.0.1:${XRI_BPQ3_TELNET:-17012}:8010"
    networks:
      xri:
        ipv4_address: 172.28.77.14

  xnet:
    # Built here from the upstream tarball (sha256 checked); never pushed.
    build: ./peers/xnet
    image: xri-local/xnet:1.38
    pull_policy: never
    container_name: xri-xnet
    profiles: [xnet]
    depends_on: [relay]
    environment:
      XNET_CALL: PN0XN
      XNET_ALIAS: XNET
      XNET_PEER_IP: 172.28.77.10
      XNET_UDP_LOCAL: "10093"
      XNET_UDP_DEST: "20008"
      # XNet's minimum NODES interval is 300 s; L3RTT every 30 s like XRouter.
      XNET_NODES_INTERVAL: "300"
      XNET_RTT_INTERVAL: "30"
    ports:
      - "127.0.0.1:${XRI_XNET_CONSOLE:-17015}:8023"
    networks:
      xri:
        ipv4_address: 172.28.77.15

  tnn:
    # Built here from source at a pinned commit (32-bit); never pushed.
    build: ./peers/tnn
    image: xri-local/tnn:1.79
    pull_policy: never
    container_name: xri-tnn
    profiles: [tnn]
    depends_on: [relay]
    tty: true
    environment:
      TNN_CALL: PN0TN
      TNN_ALIAS: TNN
      TNN_AXUDP_PORT: "10093"
      TNN_PEER_CALL: PN0XR
      TNN_PEER_ALIAS: XRNODE
      TNN_PEER_IP: 172.28.77.10
      TNN_PEER_PORT: "20010"
    ports:
      - "127.0.0.1:${XRI_TNN_TELNET:-17014}:23"
    networks:
      xri:
        ipv4_address: 172.28.77.16

  thenet:
    image: ghcr.io/packethacking/tnc2-emu:${TNC2_TAG:-0.1.0}
    container_name: xri-thenet
    profiles: [thenet]
    environment:
      TNC2_CALL: PN0TH
      TNC2_ALIAS: THENET
      # PARMS 3 (radio port quality) = 192 and PARMS 7 (NODES interval) = 60 s.
      TNC2_POKE: "4C=C0,00;54=3C,00"
      TNC2_MONITOR: "1"
    volumes:
      - thenet-data:/data
    ports:
      - "127.0.0.1:${XRI_THENET_CONSOLE:-17013}:8002"
    networks:
      xri:
        ipv4_address: 172.28.77.17

  xrpeer:
    image: ghcr.io/packethacking/xrouter:${XROUTER_PEER_TAG:-latest}
    container_name: xri-xrpeer
    profiles: [xrpeer]
    depends_on: [relay]
    cap_add: [NET_RAW]
    volumes:
      - xrpeer-data:/data
      - ./config/xrpeer/XROUTER.CFG:/data/XROUTER.CFG:ro
      - ./config/xrpeer/ACCESS.SYS:/data/ACCESS.SYS:ro
    ports:
      - "127.0.0.1:${XRI_XRPEER_TELNET:-17024}:23"
    networks:
      xri:
        ipv4_address: 172.28.77.18

networks:
  xri:
    name: xri-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.77.0/24

volumes:
  xrouter-data:
  linbpq-data:
  linbpq2-data:
  linbpq3-data:
  thenet-data:
  xrpeer-data:
