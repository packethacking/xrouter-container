# Known XRouter issues, by version.
#
# Each [[issue]] lists the tests it breaks and the XRouter versions it is
# known to affect: `from` (optional, default: every earlier version) up to
# and including `until`. In those versions a failure of those tests is an
# expected fail and the run stays green. Every later version is expected to
# pass, so a new XRouter release that has not fixed the issue goes red and
# someone has to either report it again or move `until` forward.
#
# strict = true (the default) also turns the run red if a listed test passes
# in an affected version: the issue may have been fixed, so check and update
# this file. Use strict = false only for failures that depend on timing and
# do not happen every run.
#
# `finding` points at the matching section of FINDINGS.md; `reported` says
# when and where it went to the author, if it has.
#
# `issue` is the GitHub issue for it in this repo. Every entry about XRouter
# (no `applies_to`, or "peer", the second XRouter) must have one; the suite
# refuses to run without it. Entries for the other implementations have none:
# those bugs are not XRouter's and live in FINDINGS.md only. Several entries
# can share one issue. `fixed_in` is the first XRouter version with the fix;
# set it exactly when the issue is closed (interop/check_issue_links.py
# checks this against GitHub in CI).
#
# `applies_to` says whose bug it is when it is not the XRouter under test:
# "peer" is the second XRouter (from/until are then matched against its
# version, XROUTER_PEER_TAG), and "xnet", "tnn", "thenet" or "linbpq" are
# those implementations, which do not change with the XRouter version, so
# such an issue applies whatever XRouter version is under test and has no
# from/until.

[[issue]]
id = "no-scheduled-rif"
issue = "https://github.com/packethacking/xrouter-container/issues/4"
title = "XRouter ignores INPBCINTERVAL: it re-sends its routes only every 10 minutes"
finding = 2
until = "505o"
tests = ["test_xrouter_refreshes_rif_on_schedule", "test_xrouter_refreshes_rif_to_xnet",
         "test_xrouter_refreshes_rif_to_tnn", "test_xrouter_refreshes_rif_to_xrpeer"]

[[issue]]
id = "own-node-tt0"
issue = "https://github.com/packethacking/xrouter-container/issues/5"
title = "XRouter sends its own node with trip time 0 (INP3 range is 1 to 60000)"
finding = 3
until = "505o"
tests = ["test_xrouter_rif_fields_in_spec_range", "test_xrouter_rif_to_xnet_fields_in_spec_range",
         "test_xrouter_rif_to_tnn_fields_in_spec_range", "test_xrouter_rif_to_xrpeer_fields_in_spec_range"]

[[issue]]
id = "late-initial-rif"
issue = "https://github.com/packethacking/xrouter-container/issues/8"
fixed_in = "505m"
title = "XRouter holds RIFs back for minutes, after the link comes up and after changes"
finding = 1
until = "505l"
# How long XRouter takes varies from run to run (six minutes in one 505c
# run, none at all in seven minutes in another), so some of these can pass.
strict = false
tests = [
  "test_xrouter_forwards_recovered_third_party_to_bpq3",
  "test_xrouter_forwards_negative_info_to_xnet",
  "test_xrouter_forwards_negative_info_to_tnn",
  "test_xrouter_forwards_negative_info_to_xrpeer",
  "test_xnet_relearns_bpq_side_after_link_restored",
  "test_tnn_relearns_bpq_side_after_link_restored",
  "test_xrpeer_relearns_bpq_side_after_link_restored",
  "test_xnet_recovers_when_link_restored",
  "test_tnn_recovers_when_link_restored",
  "test_xrouter_sends_rif",
  "test_own_node_rip_has_hop_count_one",
  "test_bpq_marks_xrouter_route_as_inp3",
  "test_xrouter_nodes_reach_bpq2_through_bpq",
  "test_bpq_learns_xrouter_application_by_inp3",
  "test_xrouter_relays_bpq_routes_to_bpq3",
  "test_xrouter_relays_bpq3_to_bpq",
  "test_routes_recover_when_link_restored",
  "test_xrouter_resends_own_rif_after_link_restored",
  "test_bpq3_relearns_bpq_side_after_link_restored",
  "test_bpq3_learns_whole_network_through_xrouter",
  "test_l4_connect_bpq3_to_bpq2_through_xrouter",
  "test_xrouter_forwards_negative_info_to_bpq3",
]

