# AX25IP (AXUDP) config, generated by entrypoint.sh.
# Listen on this UDP port.
socket udp ${TNN_AXUDP_PORT}
loglevel 2
# Frames for the neighbour, and everything else (NODES and other UI
# broadcasts go to a pseudo-destination, so they need the default route).
route ${TNN_PEER_CALL} ${TNN_PEER_IP} udp ${TNN_PEER_PORT}
route default ${TNN_PEER_IP} udp ${TNN_PEER_PORT}
