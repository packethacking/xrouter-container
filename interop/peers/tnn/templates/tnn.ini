# tnn.ini for the interop suite (generated by entrypoint.sh from a template).
tnn_dir /usr/local/tnn/
buffers 10000
tnn_procfile tnn.pid
# AX25IP (AXUDP) on L2 port 0. TNN allows only one AX25IP device;
# its UDP socket and peers are in ax25ip.cfg.
device AX25IP
kisstype 8
port 0
# Telnet server (the console for the tests) on L2 port 1.
device ${TNN_TELNET_PORT}
kisstype 22
port 1
