; LinBPQ for the regress suite's route-choice test (test_52_routing_bpq):
; it takes the neighbour XRouter's place at 172.28.78.12 as the DUT's INP3
; neighbour (PE1OEZ's role in groups.io 4400), and also hears the station
; PN0TX directly on its port 3, from probe C (the test process, host:30003).

SIMPLE=1
NODECALL=PN0BP
NODEALIAS=BPQNB
LOCATOR=IO91WM
NODESINTERVAL=1
RIFINTERVAL=60
T3=15
DEBUGINP3=1

CTEXT:
PN0BP regress LinBPQ neighbour
***

PORT
 PORTNUM=1
 ID=Telnet
 DRIVER=Telnet
 CONFIG
 TCPPORT=8010
 MAXSESSIONS=4
 USER=sysop,sysop,PN0BP,,SYSOP
ENDPORT

; AXUDP to the DUT's port 3 (the DUT sends from 10095 to us on 10093).
PORT
 PORTNUM=2
 ID=AXUDP to DUT
 DRIVER=BPQAXIP
 QUALITY=200
 MINQUAL=1
 FRACK=2000
 RESPTIME=200
 RETRIES=3
 MAXFRAME=4
 PACLEN=236
 CONFIG
 UDP 10093
 BROADCAST NODES
 MAP PN0DUT 172.28.78.11 UDP 10095 B
ENDPORT

; AXUDP to probe C, where a fake node plays PN0TX.
PORT
 PORTNUM=3
 ID=AXUDP to probe C
 DRIVER=BPQAXIP
 QUALITY=200
 MINQUAL=1
 FRACK=2000
 RESPTIME=200
 RETRIES=3
 MAXFRAME=4
 PACLEN=236
 CONFIG
 UDP 10094
 BROADCAST NODES
 MAP PN0TX 172.28.78.1 UDP 30003 B
ENDPORT

; Locked neighbour routes with the INP3 flag:
; call, quality, port, maxframe, frack, paclen, inp3
ROUTES:
PN0DUT,200,2,0,0,0,1
PN0TX,200,3,0,0,0,1
***
