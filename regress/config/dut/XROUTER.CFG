# XROUTER.CFG for the regress suite's node under test (DUT).
#
# Comment lines must start in column 1. Addresses are on the regress
# network 172.28.78.0/24: .1 is the docker host (the test process, which
# owns the AXUDP "probes"), .11 this node, .12 the neighbour XRouter.
#
#   port 1  AXUDP to probe A (host:30001), quality 192, defaults otherwise
#   port 2  AXUDP to probe B (host:30002), explicit digi/broadcast options
#   port 3  AXUDP to the neighbour XRouter PN0NB (INP3 neighbour)
#
# This node has no TUN or Ethernet port, so AXUDP uses the Linux stack.
# The IP gateway set-up (TUN, AXIP) is a separate node, config/ip.
# 44.128.0.0/16 is the test AMPRNet: this node is 44.128.0.1 and the
# probe's station on port 1 is 44.128.1.2 (PN0TS).

NODECALL=PN0DUT
NODEALIAS=DUT
CONSOLECALL=PN0DUT
CHATCALL=PN0DUT-8
CHATALIAS=DUTCHT
PMSCALL=PN0DUT-2
PMSALIAS=DUTPMS
PMSQUAL=50
LOCATOR=IO91WL
QTH=Testville
IPADDRESS=44.128.0.1

TELNETPORT=23
HTTPPORT=80
RHPPORT=9000
AGWPORT=8000

NODESINTERVAL=1
L3RTTINTERVAL=30
INPBCINTERVAL=120
T3=15

CTEXT
PN0DUT regress test node
Type ? for list of commands.
***

INFOTEXT
PN0DUT XRouter regress suite node, sysop PN0DUT
***

IDTEXT
PN0DUT regress test node
***

APPL=1
    APPLNAME=DUTAPP
    APPLCALL=PN0DUT-1
    APPLALIAS=DUTAPP
    APPLQUAL=200
ENDAPPL

INTERFACE=1
    TYPE=AXUDP
    MTU=256
ENDINTERFACE



# Port 1: like an RF port on a node with defaults (Danny's direct link
# with quality 192, groups.io 4400).
PORT=1
    ID=Probe A
    INTERFACENUM=1
    IPLINK=172.28.78.1
    UDPLOCAL=10093
    UDPREMOTE=30001
    QUALITY=192
    FRACK=2000
    RESPTIME=200
    RETRIES=4
    MAXFRAME=4
    PACLEN=236
ENDPORT

# Port 2: explicit digipeating and broadcast options.
PORT=2
    ID=Probe B
    INTERFACENUM=1
    IPLINK=172.28.78.1
    UDPLOCAL=10094
    UDPREMOTE=30002
    QUALITY=150
    FRACK=2000
    RESPTIME=200
    RETRIES=4
    MAXFRAME=4
    PACLEN=236
    PORTALIAS2=RELAY
    DIGIFLAG=771
    BCAST=MAIL,FBB
ENDPORT

# Port 3: INP3 neighbour, another XRouter.
PORT=3
    ID=Neighbour XRouter
    INTERFACENUM=1
    IPLINK=172.28.78.12
    UDPLOCAL=10095
    UDPREMOTE=10093
    QUALITY=200
    FRACK=2000
    RESPTIME=200
    RETRIES=4
    MAXFRAME=4
    PACLEN=236
ENDPORT
