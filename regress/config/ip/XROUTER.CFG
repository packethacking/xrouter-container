# XROUTER.CFG for the regress suite's IP gateway node (PN0IP), the
# AMPRNet set-up from groups.io 4386-4397 (Jean VE2PKT): XRouter talks to
# Linux through a TUN interface, Linux carries 44-net traffic onward, and
# XRouter has AXIP (IP protocol 93) links to 44.x partners and AX.25 users
# who reach 44-net through it.
#
# Because there is a TUN port, AXUDP and AXIP to non-localhost peers use
# XRouter's own IP stack (MAN AXUDP-IFACE, AXIP-IFACE). The AX.25 port to
# the test probe therefore points at 127.0.0.1, which uses the Linux stack,
# and image/udpbridge.py inside the container relays it to the probe.
#
#   port 1  TUN tun99: XRouter end 192.168.99.99, Linux end 192.168.99.98
#   port 2  AXUDP to 127.0.0.1:30011, bridged to probe D (host:30004)
#   port 3  AXIP to 44.130.2.2, an address on the Linux side (lo)
#
# 44.130.0.1 is this node; PN0TT on port 2 is 44.130.1.2.

NODECALL=PN0IP
NODEALIAS=IPGW
CONSOLECALL=PN0IP
LOCATOR=IO91WN
IPADDRESS=44.130.0.1

TELNETPORT=23 23
NODESINTERVAL=1
T3=15

CTEXT
PN0IP regress IP gateway node
***

INTERFACE=1
    ID=Tunnel to Linux
    TYPE=TUN
    COM=tun99
    PROTOCOL=IP
    IOADDR=192.168.99.98
    MTU=1500
ENDINTERFACE

INTERFACE=2
    TYPE=AXUDP
    MTU=256
ENDINTERFACE

INTERFACE=3
    TYPE=AXIP
    MTU=256
ENDINTERFACE

PORT=1
    ID=Tunnel
    INTERFACENUM=1
    IPADDRESS=192.168.99.99
ENDPORT

PORT=2
    ID=Probe D
    INTERFACENUM=2
    IPLINK=127.0.0.1
    UDPLOCAL=10093
    UDPREMOTE=30011
    QUALITY=192
    FRACK=2000
    RESPTIME=200
    RETRIES=4
    MAXFRAME=4
    PACLEN=236
ENDPORT

PORT=3
    ID=AXIP to 44.130.2.2
    INTERFACENUM=3
    IPLINK=44.130.2.2
    QUALITY=180
    FRACK=2000
    RESPTIME=200
    RETRIES=4
    MAXFRAME=4
    PACLEN=236
ENDPORT
