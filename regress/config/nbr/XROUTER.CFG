# XROUTER.CFG for the regress suite's neighbour XRouter (PN0NB).
# Port 1 links to the DUT's port 3, port 2 to probe C (host:30003).
NODECALL=PN0NB
NODEALIAS=NBR
CONSOLECALL=PN0NB
LOCATOR=IO91WM
TELNETPORT=23
IPADDRESS=172.28.78.12
NODESINTERVAL=1
L3RTTINTERVAL=30
INPBCINTERVAL=120
T3=15

CTEXT
PN0NB regress neighbour node
***

# An application, so this node's NODES broadcasts list something: XRouter
# ignores a NODES broadcast with no entries, and the DUT broadcasts NODES
# only on its first port (interop finding 6), so without this neither
# would ever learn the other.
APPL=1
    APPLNAME=NBRAPP
    APPLCALL=PN0NB-1
    APPLALIAS=NBRAPP
    APPLQUAL=200
ENDAPPL

INTERFACE=1
    TYPE=AXUDP
    MTU=256
ENDINTERFACE

PORT=1
    ID=DUT
    INTERFACENUM=1
    IPLINK=172.28.78.11
    UDPLOCAL=10093
    UDPREMOTE=10095
    QUALITY=200
    FRACK=2000
    RESPTIME=200
    RETRIES=4
    MAXFRAME=4
    PACLEN=236
ENDPORT

PORT=2
    ID=Probe C
    INTERFACENUM=1
    IPLINK=172.28.78.1
    UDPLOCAL=10094
    UDPREMOTE=30003
    QUALITY=200
    FRACK=2000
    RESPTIME=200
    RETRIES=4
    MAXFRAME=4
    PACLEN=236
ENDPORT
