# Known XRouter regressions and bugs the regress suite tracks, by version.
#
# Same rules as interop/known-issues.toml: each [[issue]] lists the tests it
# breaks and the versions it affects, `from` (default: every earlier
# version) up to and including `until` (default: every later version, for
# an issue still open). Affected tests are expected failures (XFAIL);
# strict = true (default) turns an unexpected pass red so a fix is noticed.
# `issue` links the GitHub issue; an entry without one must say why in
# `no_issue`. When an issue is fixed: set `until` to the last affected
# version and `fixed_in` to the first fixed one, then close the issue.
# regress/check_known_issues.py checks all this (offline, and against GitHub).

[[issue]]
id = "rhp-bind-reply-malformed"
issue = "https://github.com/packethacking/xrouter-container/issues/2"
title = "RHP bind reply is not valid JSON (type bind, errText label missing)"
from = "505o"
until = "505o"
fixed_in = "505p"
tests = ["test_rhp_bind_listen_reply"]

[[issue]]
id = "agw-unproto-needs-registration"
issue = "https://github.com/packethacking/xrouter-container/issues/11"
title = "AGW 'M' unproto from a client that has not registered a callsign is not sent"
from = "505d"
tests = ["test_agw_send_ui_unregistered"]

[[issue]]
id = "nodes-first-port-only"
issue = "https://github.com/packethacking/xrouter-container/issues/6"
title = "Scheduled NODES broadcasts only go out on the first port"
tests = ["test_dut_broadcasts_nodes_on_port2"]

[[issue]]
id = "fbb-bad-compressed-data-hangs"
issue = "https://github.com/packethacking/xrouter-container/issues/12"
title = "Undecodable compressed (FA) message hangs the whole node"
from = "505d"
tests = ["test_fbb_bad_compressed_data_does_not_hang_node"]

[[issue]]
id = "read-forwarded-no-body"
issue = "https://github.com/packethacking/xrouter-container/issues/13"
title = "R n / n show an empty body for forwarded messages with no blank line after the R: lines"
tests = ["test_read_forwarded_message_shows_body", "test_read_mbl_forwarded_message_shows_body"]

[[issue]]
id = "fbb-sid-silent"
issue = "https://github.com/packethacking/xrouter-container/issues/14"
title = "After an FBB SID, user commands get no answer at all"
from = "505d"
tests = ["test_user_command_after_fbb_sid_gets_an_answer"]

[[issue]]
id = "dedhost-no-unproto"
no_issue = "not established as a bug: same on 505c, may be set-up we have not found"
title = "DEDHOST emulation: channel 0 unproto info is not transmitted (505c too; may need set-up we have not found)"
tests = ["test_dedhost_unproto_beacon"]

[[issue]]
id = "fbb-ascii-out-no-ctrl-z"
issue = "https://github.com/packethacking/xrouter-container/issues/22"
title = "FBB ASCII forwarding out (FB) ends messages with /EX instead of Ctrl-Z"
from = "505d"
tests = ["test_fbb_reverse_forward_ascii_ends_with_ctrl_z"]

[[issue]]
id = "mbl-out-stray-nul"
issue = "https://github.com/packethacking/xrouter-container/issues/23"
title = "MBL forwarding out puts a NUL byte before /EX"
until = "505c"
fixed_in = "505d"
tests = ["test_mbl_reverse_forward"]
