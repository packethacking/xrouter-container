# Minimal XRouter for the bug reproductions in regress/repro.
# Telnet on 127.0.0.1:8023, AGW on 8000, a BBS, and one
# AXUDP port to 127.0.0.1:9999, where a script can see what XRouter
# transmits on air.
NODECALL=PN0RPR
NODEALIAS=REPRO
CONSOLECALL=PN0RPR
LOCATOR=IO91WL
IPADDRESS=127.0.0.1
TELNETPORT=8023
AGWPORT=8000
PMSCALL=PN0RPR-2
PMSALIAS=RPRBBS
PMSTYPE=4

CTEXT
PN0RPR repro node
***

INTERFACE=1
    TYPE=AXUDP
    MTU=256
ENDINTERFACE

PORT=1
    ID=AXUDP to host
    INTERFACENUM=1
    IPLINK=127.0.0.1
    UDPLOCAL=10093
    UDPREMOTE=9999
    QUALITY=192
ENDPORT
